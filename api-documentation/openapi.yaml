openapi:  3.0.0


info:
  title:  MyTask API
  description: API for managing tasks
  version:  1.0.0


paths:
  /tasks/{id}:
    get:
      summary: Get a task
      description: Retrieves a task using its unique ID.


      parameters:      
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Unique identifier of the task.

      responses:
        '200':
          description: Task   retrieved successfully.
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found.

  /tasks:
    post:
      summary: Create a task
      description: Creates a new task.
      
      requestBody:  
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                completed:
                  type: boolean  

      responses:
        '201':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid request.            
       

components:
  schemas:
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string  
        completed:
          type: boolean


  













